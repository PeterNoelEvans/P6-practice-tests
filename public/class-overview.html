<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Progress Overview</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .progress-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .progress-table th, .progress-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        .progress-table th {
            background-color: #f5f5f5;
        }
        .progress-cell {
            position: relative;
        }
        .progress-bar {
            background-color: #4CAF50;
            height: 20px;
            border-radius: 10px;
        }
        .progress-text {
            position: absolute;
            width: 100%;
            text-align: center;
            line-height: 20px;
            color: black;
        }
        .button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }
        .export-button {
            background-color: #28a745;
        }
    </style>
</head>
<body>
    <div class="nav-buttons">
        <button onclick="window.location.href='/dashboard.html'" class="button">Back to Dashboard</button>
        <button onclick="exportToCSV()" class="button export-button">Export to CSV</button>
    </div>

    <h1>Class Progress Overview</h1>
    
    <table class="progress-table">
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Overall Progress</th>
                <th>Grammar</th>
                <th>Vocabulary</th>
                <th>Reading</th>
                <th>Micekings</th>
            </tr>
        </thead>
        <tbody id="progressTableBody">
            <!-- Data will be inserted here -->
        </tbody>
    </table>

    <script>
        // Check if user is admin
        const studentName = localStorage.getItem('studentName');
        if (studentName !== 'Peter Evans') {
            window.location.href = '/dashboard.html';
        }

        async function loadClassProgress() {
            try {
                const response = await fetch('/api/admin/class-progress', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('authToken')}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch class progress');
                }

                const data = await response.json();
                displayProgress(data);
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load class progress');
            }
        }

        function displayProgress(progressData) {
            const tbody = document.getElementById('progressTableBody');
            tbody.innerHTML = progressData.map(student => {
                return `
                    <tr>
                        <td>${student.studentName}</td>
                        <td class="progress-cell">
                            <div class="progress-bar" style="width: ${student.overallProgress}%"></div>
                            <div class="progress-text">${Math.round(student.overallProgress)}%</div>
                        </td>
                        <td class="progress-cell">
                            <div class="progress-bar" style="width: ${student.sectionScores.grammar}%"></div>
                            <div class="progress-text">${Math.round(student.sectionScores.grammar)}%</div>
                        </td>
                        <td class="progress-cell">
                            <div class="progress-bar" style="width: ${student.sectionScores.vocabulary}%"></div>
                            <div class="progress-text">${Math.round(student.sectionScores.vocabulary)}%</div>
                        </td>
                        <td class="progress-cell">
                            <div class="progress-bar" style="width: ${student.sectionScores.reading}%"></div>
                            <div class="progress-text">${Math.round(student.sectionScores.reading)}%</div>
                        </td>
                        <td class="progress-cell">
                            <div class="progress-bar" style="width: ${student.sectionScores.micekings}%"></div>
                            <div class="progress-text">${Math.round(student.sectionScores.micekings)}%</div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function exportToCSV() {
            // Implementation for CSV export
            // We can add this functionality if you'd like
        }

        // Load progress when page loads
        loadClassProgress();
    </script>
</body>
</html>
